name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install verified Gitleaks
        run: python scripts/install_gitleaks.py
      - name: Scan all Git history and working sources
        run: python scripts/scan_secrets.py source

  render:
    needs: source-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # The setup action exports github.token even for public release downloads.
      # Install this public release directly without passing a token to Quarto.
      - name: Install Quarto 1.10.18
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/quarto.deb" \
            https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/quarto.deb"
      - name: Install verified Gitleaks
        run: python scripts/install_gitleaks.py
      - name: Test numerical models and static audio assets
        run: |
          python -m pip install pytest numpy
          python -m pytest -q
      - name: Render full site
        run: python scripts/check.py
      - name: Scan complete Pages artifact before upload
        run: python scripts/scan_secrets.py site
      - name: Upload site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: course/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [source-scan, render]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
