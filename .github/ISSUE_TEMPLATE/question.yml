name: Вопрос
description: Вопрос по материалам курса, лекции или демонстрации
title: "[Вопрос]: "
body:
  - type: markdown
    attributes:
      value: |
        Здесь можно задать вопрос, который возник на лекции или при самостоятельном чтении. Не обязательно знать точные термины — опишите своими словами, что хочется понять.

        Вопрос и ответ будут видны другим студентам и помогут тем, кто задумался о том же.
  - type: input
    id: page
    attributes:
      label: Страница или файл
      description: Если вопрос связан с конкретным материалом, укажите ссылку или тему лекции. Это поле можно оставить пустым.
  - type: textarea
    id: question
    attributes:
      label: Ваш вопрос
      description: Что осталось непонятным или о чём хотелось бы узнать подробнее?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Что уже понятно и где возникло затруднение?
      description: Необязательно. Можно привести фрагмент материала, пример или свои рассуждения.
