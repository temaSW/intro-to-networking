```{=html}
<div class="course-demo" data-clock-drift>
<div class="mux-controls">
<label>Насколько Б быстрее А, миллионных долей (ppm)<input type="number" aria-label="Отклонение частоты Б, ppm" data-clock-number="ppm" min="0" max="50" step="1" value="25"><input type="range" aria-label="Отклонение частоты Б, ползунок" data-clock-parameter="ppm" min="0" max="50" step="1" value="25"></label>

</div>
<div data-clock-results aria-live="polite"></div>
<div class="mux-scroll" data-clock-plot tabindex="0" role="region" aria-label="Накопление рассогласования частот"></div>
<p class="mux-reading-key">Сравнивается число сформированных битов за один интервал. Источники начинают отсчёт одновременно; диапазон отклонения задан для опыта. Это не формат кадра PDH и не модель потерь. На графике соединены отсчёты через 10 мс; шкала сохраняется при изменении параметров.</p>
<noscript><p>При отклонении Б на 25 миллионных долей за 1 с А создаст 2 048 000 бит, Б -- 2 048 051 бит. Разность счётчиков составит 51 бит.</p></noscript>
</div>
