<script>
document.addEventListener('DOMContentLoaded', () => {
  const pageFields = {
    '1FAIpQLScbsWOaqw31Cs30H-o3cjq4DoBKEsViXSzSD4I5BL1WjgEKfg': 'entry.2027801067',
    '1FAIpQLSc70niaI42Az7F9qNkiEeF9JAoNoPknDjI07u4-hGrBYuqM-Q': 'entry.614899729',
    '1FAIpQLSeF4BRW5MGA_C1SvuoBoP2nhr4O8fRkI7xRpUPRTcFhe3KEXA': 'entry.633006356',
  };
  const updates = [];
  for (const link of document.querySelectorAll('.quarto-navbar-tools a[href^="https://docs.google.com/forms/d/e/"], a[data-course-feedback][href^="https://docs.google.com/forms/d/e/"]')) {
    const form = new URL(link.href);
    const entry = pageFields[form.pathname.split('/')[4]];
    if (!entry) continue;
    link.querySelector('i')?.setAttribute('aria-hidden', 'true');
    const updatePage = () => {
      const url = new URL(form.href);
      url.searchParams.set('usp', 'pp_url');
      url.searchParams.set(entry, window.location.href);
      link.href = url.href;
    };
    updatePage();
    updates.push(updatePage);
    // Refresh before keyboard/click, middle-click, and the native context menu.
    for (const event of ['click', 'auxclick', 'pointerdown', 'mousedown', 'contextmenu', 'focus']) {
      link.addEventListener(event, updatePage);
    }
  }
  for (const event of ['hashchange', 'popstate', 'pageshow']) {
    window.addEventListener(event, () => updates.forEach(update => update()));
  }

  const toc = document.querySelector('#quarto-margin-sidebar > #TOC');
  if (!toc) return;

  const disclosure = document.createElement('details');
  disclosure.className = 'toc-disclosure';
  const summary = document.createElement('summary');
  summary.textContent = 'Содержание страницы';
  disclosure.append(summary, toc);
  document.querySelector('#quarto-margin-sidebar').append(disclosure);
});
</script>
