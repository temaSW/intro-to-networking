<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="title desc">
  <title id="title">Три кнопки обратной связи через Google Forms</title>
  <desc id="desc">Красный жук — ошибка. Золотистая лампочка — улучшение. Синий вопросительный знак — вопрос. Кнопки находятся в правом верхнем углу каждой страницы курса.</desc>
  <style>
    .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { fill: #183037; font: 600 19px system-ui, sans-serif; }
  </style>
  <rect x="12" y="10" width="58" height="58" rx="8" fill="#fff0ed" stroke="#a52e28"/>
  <g class="icon" color="#a52e28" transform="translate(22 19)">
    <path d="M14 12V8a6 6 0 0 1 12 0v4M12 12h16v15a8 8 0 0 1-16 0Z M20 12v23M14 5l-4-4M26 5l4-4M12 16H6M28 16h6M12 23H5M28 23h7M13 30l-6 6M27 30l6 6"/>
  </g>
  <text x="94" y="45">Сообщить об ошибке</text>
  <rect x="12" y="80" width="58" height="58" rx="8" fill="#fff5d6" stroke="#795500"/>
  <g class="icon" color="#795500" transform="translate(22 88)">
    <path d="M14 30v-4C3 15 9 3 20 3s17 12 6 23v4ZM14 34h12M17 38h6M16 15l4 5 4-5M20 20v10"/>
  </g>
  <text x="94" y="115">Предложить улучшение</text>
  <rect x="12" y="150" width="58" height="58" rx="8" fill="#edf3ff" stroke="#2459ad"/>
  <g class="icon" color="#2459ad" transform="translate(22 160)">
    <circle cx="19" cy="19" r="17"/>
    <path d="M13 13a6 6 0 1 1 9 5c-3 1-3 3-3 5"/>
    <circle cx="19" cy="29" r="1" fill="#2459ad"/>
  </g>
  <text x="94" y="185">Задать вопрос</text>
</svg>
