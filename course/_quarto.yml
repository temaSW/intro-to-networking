project:
  type: website
  output-dir: _site
  resources:
    - assets/scroll-demo/**
    - assets/lecture-04/keying-*.svg
    - interactives/*.js
    - interactives/audio-channel-coding/**
    - assets/audio-channel-coding/**
    - styles/companding-line.css
    - styles/scrambler.css
    - styles/channel-playground.css

website:
  title: "ОПИСиС"
  description: "Новая версия курса"
  site-url: https://temasw.github.io/intro-to-networking/
  search: true
  page-navigation: true
  navbar:
    tools-collapse: false
    tools:
      - icon: bug
        href: https://docs.google.com/forms/d/e/1FAIpQLScbsWOaqw31Cs30H-o3cjq4DoBKEsViXSzSD4I5BL1WjgEKfg/viewform
        text: "Сообщить об ошибке"
        aria-label: "Сообщить об ошибке"
        target: _blank
        rel: noopener noreferrer
      - icon: lightbulb
        href: https://docs.google.com/forms/d/e/1FAIpQLSc70niaI42Az7F9qNkiEeF9JAoNoPknDjI07u4-hGrBYuqM-Q/viewform
        text: "Предложить улучшение"
        aria-label: "Предложить улучшение"
        target: _blank
        rel: noopener noreferrer
      - icon: question-circle
        href: https://docs.google.com/forms/d/e/1FAIpQLSeF4BRW5MGA_C1SvuoBoP2nhr4O8fRkI7xRpUPRTcFhe3KEXA/viewform
        text: "Задать вопрос"
        aria-label: "Задать вопрос"
        target: _blank
        rel: noopener noreferrer
    left:
      - text: "О курсе"
        href: index.qmd
      - text: "Лекции"
        href: lectures/index.qmd
      - text: "Практика"
        href: practice/index.qmd
      - text: "Лабораторные"
        href: labs/index.qmd
      - text: "Справочник"
        href: reference/index.qmd

format:
  html:
    lang: ru
    include-after-body: _includes/navigation.html
    theme:
      light: [cosmo, styles/base.scss]
      dark: [darkly, styles/base.scss]
    respect-user-color-scheme: true
    toc: true
    anchor-sections: true

execute:
  freeze: auto
