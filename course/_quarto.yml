project:
  type: website
  output-dir: _site
  resources:
    - assets/scroll-demo/**
    - assets/lecture-04/keying-*.svg
    - interactives/*.js
    - interactives/audio-channel-coding/**
    - assets/audio-channel-coding/**
    - styles/companding-line.css
    - styles/scrambler.css
    - styles/channel-playground.css

website:
  title: "ОПИСиС"
  description: "Новая версия курса"
  site-url: https://temasw.github.io/intro-to-networking/
  search: true
  page-navigation: true
  navbar:
    tools-collapse: true
    tools:
      - icon: bug
        href: https://github.com/temaSW/intro-to-networking/issues/new?template=bug_report.yml
        text: "Сообщить об ошибке"
        aria-label: "Сообщить об ошибке"
        target: _blank
        rel: noopener noreferrer
      - icon: lightbulb
        href: https://github.com/temaSW/intro-to-networking/issues/new?template=feature_request.yml
        text: "Предложить улучшение"
        aria-label: "Предложить улучшение"
        target: _blank
        rel: noopener noreferrer
    left:
      - text: "О курсе"
        href: index.qmd
      - text: "Лекции"
        href: lectures/index.qmd
      - text: "Практика"
        href: practice/index.qmd
      - text: "Лабораторные"
        href: labs/index.qmd
      - text: "Справочник"
        href: reference/index.qmd

format:
  html:
    lang: ru
    include-after-body: _includes/navigation.html
    theme:
      light: [cosmo, styles/base.scss]
      dark: [darkly, styles/base.scss]
    respect-user-color-scheme: true
    toc: true
    anchor-sections: true

execute:
  freeze: auto
